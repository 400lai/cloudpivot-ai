<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志 · 云枢智学管理后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-admin-page="logs" data-page-title="操作日志" data-crumb="系统管理">
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content" id="adminContent">

      <div class="admin-page-head">
        <div><h1>操作日志</h1><p>记录后台用户的关键操作，点击行可查看详情</p></div>
        <div class="admin-page-actions">
          <button class="btn btn-outline btn-sm" id="exportLogsBtn"><span data-icon="download" data-icon-size="14"></span> 导出日志</button>
          <button class="btn btn-danger-soft btn-sm" id="clearLogsBtn"><span data-icon="trash" data-icon-size="14"></span> 清空日志</button>
        </div>
      </div>

      <div class="admin-filter">
        <div class="input-wrap search-input"><span data-icon="search" data-icon-size="16"></span>
          <input class="input" id="logSearch" placeholder="搜索用户 / 操作 / 目标" style="padding-left:38px">
        </div>
        <select class="select" id="logTypeFilter">
          <option value="all">全部操作类型</option>
          <option value="login">登录</option>
          <option value="create">新增·创建·上传</option>
          <option value="edit">修改·编辑</option>
          <option value="delete">删除</option>
          <option value="disable">禁用·启用</option>
          <option value="other">其他</option>
        </select>
        <span class="admin-filter-label">日期</span>
        <input class="input" type="date" id="logDateFrom" style="width:150px">
        <span class="muted-2">至</span>
        <input class="input" type="date" id="logDateTo" style="width:150px">
        <span class="small muted" id="logCount" style="margin-left:auto"></span>
      </div>

      <div class="admin-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>用户</th><th>操作</th><th>目标</th><th>IP 地址</th><th>时间</th></tr></thead>
            <tbody id="logTable"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="logPagination"></div>
      </div>

    </main>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/pages/admin-logs.js"></script>
</body>
</html>
