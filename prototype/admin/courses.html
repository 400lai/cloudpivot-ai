<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B站课程库 · 云枢智学管理后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-admin-page="courses" data-page-title="B站课程库" data-crumb="内容管理">
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content" id="adminContent">

      <div class="admin-page-head">
        <div><h1>B站课程库</h1><p>独立维护课程资源，学习路线可引用课程库中的课程</p></div>
        <div class="admin-page-actions">
          <button class="btn btn-outline btn-sm" id="importCoursesBtn"><span data-icon="upload" data-icon-size="14"></span> 批量导入</button>
          <button class="btn btn-primary btn-sm" id="addCourseBtn"><span data-icon="plus" data-icon-size="15"></span> 新增课程</button>
        </div>
      </div>

      <div class="admin-stat-grid" id="courseStats"></div>

      <div class="admin-filter">
        <div class="input-wrap search-input"><span data-icon="search" data-icon-size="16"></span>
          <input class="input" id="courseSearch" placeholder="搜索课程标题" style="padding-left:38px">
        </div>
        <select class="select" id="courseSubjectFilter"><option value="all">全部学科</option></select>
        <select class="select" id="courseSourceFilter">
          <option value="all">全部来源</option>
          <option value="B站">B站</option>
          <option value="其他">其他</option>
        </select>
        <span class="small muted" id="courseCount" style="margin-left:auto"></span>
      </div>

      <div class="admin-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th style="width:50px">序号</th><th>封面</th><th>课程名称</th><th>时长</th><th>学科</th><th>来源</th><th style="width:100px">操作</th></tr></thead>
            <tbody id="courseTable"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="coursePagination"></div>
      </div>

    </main>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/pages/admin-courses.js"></script>
</body>
</html>
