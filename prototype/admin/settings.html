<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置 · 云枢智学管理后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-admin-page="settings" data-page-title="系统设置" data-crumb="系统管理">
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content" id="adminContent">

      <div class="admin-page-head">
        <div><h1>系统设置</h1><p>配置平台的基本信息与展示内容</p></div>
      </div>

      <div class="admin-card settings-card">
        <div class="admin-card-head"><div><h3>基本信息设置</h3><p>修改后将在学员端与浏览器标题中展示</p></div></div>
        <form id="settingsForm">
          <div class="settings-section">
            <h3>平台信息</h3>
            <p>平台名称会显示在浏览器标题与 Logo 旁</p>
            <div class="settings-field-row">
              <div class="settings-field-label">平台名称 <span class="required">*</span></div>
              <div class="settings-field-control field" style="gap:6px">
                <input class="input" id="settingName" placeholder="请输入平台名称">
                <p class="field-error">平台名称不能为空</p>
              </div>
            </div>
            <div class="settings-field-row">
              <div class="settings-field-label">平台描述</div>
              <div class="settings-field-control">
                <textarea class="textarea" id="settingDesc" placeholder="多行文本，用于介绍平台"></textarea>
                <div class="settings-field-tip">建议 50–120 字，用于首页与分享信息展示。</div>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3>品牌资产</h3>
            <p>Logo 与默认头像将用于平台品牌展示</p>
            <div class="settings-field-row">
              <div class="settings-field-label">Logo</div>
              <div class="settings-field-control">
                <div class="settings-upload-row">
                  <div class="settings-preview" id="logoPreview" data-icon="sparkles" data-icon-size="26"></div>
                  <div class="stack gap-6">
                    <button class="btn btn-outline btn-sm" type="button" id="uploadLogoBtn"><span data-icon="upload" data-icon-size="14"></span> 上传 Logo</button>
                    <span class="settings-field-tip">建议尺寸 256×256，支持 JPG / PNG</span>
                  </div>
                  <input type="file" id="logoInput" accept="image/jpeg,image/png" hidden>
                </div>
              </div>
            </div>
            <div class="settings-field-row">
              <div class="settings-field-label">默认头像</div>
              <div class="settings-field-control">
                <div class="settings-upload-row">
                  <div class="settings-preview" id="avatarPreview" data-icon="user" data-icon-size="26"></div>
                  <div class="stack gap-6">
                    <button class="btn btn-outline btn-sm" type="button" id="uploadDefaultAvatarBtn"><span data-icon="upload" data-icon-size="14"></span> 上传默认头像</button>
                    <span class="settings-field-tip">用户未设置头像时展示，建议 256×256</span>
                  </div>
                  <input type="file" id="defaultAvatarInput" accept="image/jpeg,image/png" hidden>
                </div>
              </div>
            </div>
          </div>
        </form>
        <div class="settings-footer">
          <button class="btn btn-outline" id="resetSettingsBtn"><span data-icon="rotate" data-icon-size="15"></span> 恢复默认值</button>
          <button class="btn btn-primary" id="saveSettingsBtn"><span data-icon="check" data-icon-size="15"></span> 保存设置</button>
        </div>
      </div>

      <div class="admin-card" style="margin-top:16px;max-width:820px">
        <div class="admin-card-head"><div><h3>原型工具</h3><p>仅用于演示，不影响真实业务数据</p></div></div>
        <div class="admin-card-body row-between" style="gap:16px;flex-wrap:wrap">
          <div><b style="font-size:12px">重置全部演示数据</b><p class="small muted" style="margin-top:3px">清空本地学习进度、错题、面试记录与后台修改，恢复到初始演示状态。</p></div>
          <button class="btn btn-danger-soft btn-sm" id="resetDemoBtn"><span data-icon="refresh" data-icon-size="14"></span> 重置演示数据</button>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/pages/admin-settings.js"></script>
</body>
</html>
