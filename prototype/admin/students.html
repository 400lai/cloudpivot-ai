<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学员管理 · 云枢智学管理后台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-admin-page="students" data-page-title="学员管理" data-crumb="学员管理">
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>
    <main class="admin-content" id="adminContent">

      <div class="admin-page-head">
        <div><h1>学员管理</h1><p>学员由前台注册产生，此处可查看、启禁用与删除</p></div>
      </div>

      <div class="admin-filter">
        <div class="input-wrap search-input"><span data-icon="search" data-icon-size="16"></span>
          <input class="input" id="studentSearch" placeholder="搜索昵称或手机号" style="padding-left:38px">
        </div>
        <select class="select" id="studentStatusFilter"><option value="all">全部状态</option><option value="active">已启用</option><option value="disabled">已禁用</option></select>
        <span class="small muted" id="studentCount" style="margin-left:auto"></span>
      </div>

      <div class="admin-batch-bar" id="studentBatchBar">
        <span>已选择 <b id="studentBatchCount">0</b> 位学员</span>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-student-batch="active"><span data-icon="check" data-icon-size="13"></span> 批量启用</button>
        <button class="btn btn-sm" data-student-batch="disabled"><span data-icon="eyeOff" data-icon-size="13"></span> 批量禁用</button>
        <button class="btn btn-sm" data-student-batch="delete" style="color:var(--red-strong);border-color:#fecaca"><span data-icon="trash" data-icon-size="13"></span> 批量删除</button>
        <button class="btn btn-sm btn-ghost" id="clearStudentSelection">取消选择</button>
      </div>

      <div class="admin-card">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th class="col-check"><label class="checkbox" style="justify-content:center"><input type="checkbox" id="selectPageStudents"><span class="box"></span></label></th>
              <th>学员</th><th>手机号</th><th>注册时间</th><th>学习天数</th><th>刷题 · 面试</th><th>状态</th><th style="width:130px">操作</th>
            </tr></thead>
            <tbody id="studentTable"></tbody>
          </table>
        </div>
        <div class="table-pagination" id="studentPagination"></div>
      </div>

    </main>
  </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/pages/admin-students.js"></script>
</body>
</html>
