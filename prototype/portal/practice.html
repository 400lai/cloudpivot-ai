<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刷题练习 · 云枢智学</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="practice-body" data-auth="required">

<div class="practice-app">
  <aside class="practice-side">
    <div>
      <a class="back-link" href="questions.html" id="backQuestions"><span data-icon="arrowLeft" data-icon-size="15"></span> 返回题库</a>
      <h1 class="practice-title" id="practiceTitle">刷题练习</h1>
      <p class="practice-sub" id="practiceSub">准备开始</p>
    </div>

    <div class="practice-progress">
      <div class="row-between"><span>练习进度</span><span><b id="progressText">0 / 0</b></span></div>
      <div class="progress"><span id="progressBar" style="width:0%"></span></div>
    </div>

    <div class="timer-box"><span data-icon="clock" data-icon-size="18"></span><span id="practiceTimer">00:00:00</span></div>

    <div>
      <div class="answer-sheet-head"><span>答题卡</span><span class="small muted" id="answeredCount">已答 0 题</span></div>
      <div class="answer-sheet" id="answerSheet"></div>
      <div class="legend">
        <span><i></i>未作答</span>
        <span><i class="current"></i>当前题</span>
        <span><i class="correct"></i>正确</span>
        <span><i class="wrong"></i>错误</span>
      </div>
    </div>

    <div class="side-foot">
      <button class="btn btn-outline btn-block" id="endPracticeBtn">结束练习</button>
    </div>
  </aside>

  <main class="practice-main">
    <div class="practice-main-head">
      <div class="crumb"><span>题库</span><span data-icon="chevronRight" data-icon-size="13"></span><b id="crumbStage">练习</b></div>
      <div class="right">
        <button class="btn btn-sm btn-ghost" id="shortcutBtn"><span class="kbd">?</span> 快捷键</button>
        <span class="badge badge-brand" id="modeBadge">顺序练习</span>
      </div>
    </div>

    <div class="practice-content" id="practiceContent"></div>

    <div class="practice-bottom" id="practiceBottom">
      <div class="practice-bottom-inner">
        <button class="btn btn-outline" id="prevBtn"><span data-icon="arrowLeft" data-icon-size="15"></span> 上一题</button>
        <div class="center-actions">
          <button class="btn btn-ghost" id="analysisBtn"><span data-icon="file" data-icon-size="15"></span> 查看解析</button>
          <span class="shortcut-hint">← → 切题 · Enter 提交/下一题</span>
        </div>
        <button class="btn btn-primary" id="nextBtn">下一题 <span data-icon="arrowRight" data-icon-size="15"></span></button>
      </div>
    </div>
  </main>
</div>

<script src="../js/common.js"></script>
<script src="../js/pages/practice.js"></script>
</body>
</html>
