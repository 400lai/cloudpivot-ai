<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错题本 · 云枢智学</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-auth="required">

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-mark">云</span>
      <span><span class="brand-name">云枢智学</span><span class="brand-sub" style="display:block">CLOUDPIVOT AI</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-nav="home">首页</a>
      <a href="routes.html" data-nav="roadmap">学习路线</a>
      <a href="questions.html" data-nav="questions" class="active">题库</a>
      <a href="ai-config.html" data-nav="interview">AI面试</a>
    </nav>
    <div class="nav-actions" id="navActions"></div>
    <button class="nav-toggle" data-nav-toggle data-icon="menu" aria-label="展开导航"></button>
  </div>
</header>

<main class="page-shell">
  <div class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Mistake Review</span>
        <h1 class="page-title" style="margin-top:10px">错题本</h1>
        <p class="page-subtitle">把每一次答错，变成下一次答对的依据。连续答对 3 次自动标记为已掌握。</p>
      </div>
      <div class="row gap-10">
        <a class="btn btn-outline" href="questions.html"><span data-icon="book" data-icon-size="16"></span> 继续刷题</a>
        <button class="btn btn-primary" id="startRedoBtn"><span data-icon="refresh" data-icon-size="16"></span> 开始重做</button>
      </div>
    </div>

    <div class="mistake-stats" id="mistakeStats"></div>

    <section id="top3Section">
      <div class="section-head" style="margin-bottom:14px">
        <div class="row gap-10">
          <h2 style="font-size:18px">高频错题 Top 3</h2>
          <span class="badge badge-amber">按错误次数排序</span>
        </div>
      </div>
      <div class="top3" id="top3Grid"></div>
    </section>

    <div class="filter-bar">
      <select class="select" id="filterStatus">
        <option value="all">全部状态</option>
        <option value="pending">待复习</option>
        <option value="mastered">已掌握</option>
      </select>
      <select class="select" id="filterSubject">
        <option value="all">全部分类</option>
      </select>
      <select class="select" id="filterTime">
        <option value="all">全部时间</option>
        <option value="7">近 7 天</option>
        <option value="30">近 30 天</option>
      </select>
      <select class="select" id="filterSort">
        <option value="recent">按最近答错时间</option>
        <option value="wrong">按错误次数</option>
      </select>
      <span class="small muted" id="filterCount" style="margin-left:auto"></span>
    </div>

    <div class="mistake-list" id="mistakeList"></div>
  </div>
</main>

<div class="batch-bar" id="batchBar">
  <span>已选择 <b id="batchCount">0</b> 项</span>
  <button class="btn btn-sm" id="batchMaster">批量标记已掌握</button>
  <button class="btn btn-sm btn-danger" id="batchRemove">批量移除</button>
  <button class="batch-cancel" id="batchCancel">取消选择</button>
</div>

<div class="redo-shell hidden" id="redoShell"></div>

<div id="siteFooter"></div>

<script src="../js/common.js"></script>
<script src="../js/portal.js"></script>
<script src="../js/pages/mistakes.js"></script>
</body>
</html>
