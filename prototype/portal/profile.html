<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 · 云枢智学</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body data-auth="required">

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-mark">云</span>
      <span><span class="brand-name">云枢智学</span><span class="brand-sub" style="display:block">CLOUDPIVOT AI</span></span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-nav="home">首页</a>
      <a href="routes.html" data-nav="roadmap">学习路线</a>
      <a href="questions.html" data-nav="questions">题库</a>
      <a href="ai-config.html" data-nav="interview">AI面试</a>
    </nav>
    <div class="nav-actions" id="navActions"></div>
    <button class="nav-toggle" data-nav-toggle data-icon="menu" aria-label="展开导航"></button>
  </div>
</header>

<main class="page-shell">
  <div class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Profile</span>
        <h1 class="page-title" style="margin-top:10px">个人中心</h1>
        <p class="page-subtitle">管理你的个人资料，查看学习数据。</p>
      </div>
      <div class="row gap-10">
        <a class="btn btn-outline" href="wrong-book.html"><span data-icon="alertCircle" data-icon-size="16"></span> 我的错题</a>
        <a class="btn btn-outline" href="interview-history.html"><span data-icon="clock" data-icon-size="16"></span> 面试记录</a>
      </div>
    </div>

    <div class="profile-grid">
      <div class="stack gap-16">
        <div class="card profile-card">
          <div class="profile-banner"></div>
          <div class="profile-main">
            <div id="profileAvatar"></div>
            <h2 id="profileName">林小满</h2>
            <div class="profile-role"><span class="badge badge-brand" id="profileRole">学员</span><span class="small muted" id="profileJoined">2025-08-12 加入</span></div>
            <div class="profile-stats" id="profileStats"></div>
          </div>
        </div>

        <div class="card profile-side-links">
          <a class="profile-side-link" href="wrong-book.html"><span data-icon="alertCircle" data-icon-size="17"></span> 我的错题本 <span style="margin-left:auto;color:var(--muted-2)" data-icon="chevronRight" data-icon-size="14"></span></a>
          <a class="profile-side-link" href="interview-history.html"><span data-icon="clock" data-icon-size="17"></span> 面试记录 <span style="margin-left:auto;color:var(--muted-2)" data-icon="chevronRight" data-icon-size="14"></span></a>
          <a class="profile-side-link" href="routes.html"><span data-icon="route" data-icon-size="17"></span> 学习路线 <span style="margin-left:auto;color:var(--muted-2)" data-icon="chevronRight" data-icon-size="14"></span></a>
          <a class="profile-side-link" href="questions.html"><span data-icon="book" data-icon-size="17"></span> 题库中心 <span style="margin-left:auto;color:var(--muted-2)" data-icon="chevronRight" data-icon-size="14"></span></a>
        </div>
      </div>

      <div class="stack gap-16">
        <div class="card">
          <div class="profile-panel-head">
            <div><h3 style="font-size:16px">基本信息</h3><p class="small muted" style="margin-top:3px">完善资料，帮助我们为你推荐更合适的内容</p></div>
          </div>
          <div class="profile-panel-body">
            <div class="avatar-upload">
              <div id="avatarPreview"></div>
              <div class="grow">
                <div style="font-size:13px;font-weight:650">头像</div>
                <div class="small muted" style="margin-top:3px">支持 JPG、PNG，建议尺寸 200×200</div>
              </div>
              <button class="btn btn-outline btn-sm" id="uploadAvatarBtn"><span data-icon="upload" data-icon-size="14"></span> 上传头像</button>
              <input type="file" id="avatarInput" accept="image/jpeg,image/png" hidden>
            </div>

            <form id="profileForm" style="margin-top:22px">
              <div class="form-grid">
                <div class="field">
                  <label class="field-label" for="profileUsername">用户名 <span class="required">*</span></label>
                  <input class="input" id="profileUsername" placeholder="请输入用户名">
                  <p class="field-error">用户名不能为空</p>
                </div>
                <div class="field">
                  <label class="field-label" for="profilePhone">手机号</label>
                  <input class="input" id="profilePhone" disabled>
                  <p class="field-hint">手机号仅支持脱敏展示，如需更换请联系客服</p>
                </div>
                <div class="field">
                  <label class="field-label" for="profileEmail">邮箱</label>
                  <input class="input" id="profileEmail" type="email" placeholder="请输入邮箱">
                  <p class="field-error">请输入正确的邮箱地址</p>
                </div>
                <div class="field">
                  <label class="field-label" for="profileGender">性别</label>
                  <select class="select" id="profileGender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="保密">保密</option>
                  </select>
                </div>
              </div>
              <div class="row-between" style="margin-top:22px">
                <span class="small muted">资料仅用于平台内展示</span>
                <button class="btn btn-primary" type="submit"><span data-icon="check" data-icon-size="15"></span> 保存修改</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="profile-panel-head">
            <div><h3 style="font-size:16px">学习数据</h3><p class="small muted" style="margin-top:3px">你的每一次练习都被记录</p></div>
            <a class="section-link" href="index.html">返回首页 <span data-icon="arrowRight" data-icon-size="14"></span></a>
          </div>
          <div class="profile-panel-body">
            <div class="profile-data-grid" id="profileLearning"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="siteFooter"></div>

<script src="../js/common.js"></script>
<script src="../js/portal.js"></script>
<script src="../js/pages/profile.js"></script>
</body>
</html>
