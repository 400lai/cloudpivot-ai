<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 · 云枢智学</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234F46E5%27/%3E%3Cstop offset=%271%27 stop-color=%27%238B5CF6%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E云%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="auth-page" data-auth-page="forgot">

<div class="auth-shell">
  <aside class="auth-aside">
    <a class="brand" href="index.html">
      <span class="brand-mark">云</span>
      <span><span class="brand-name">云枢智学</span><span class="brand-sub" style="display:block">CLOUDPIVOT AI</span></span>
    </a>
    <div class="auth-aside-body">
      <span class="eyebrow" style="color:#c7d2fe">Reset Password</span>
      <h1>找回密码，<br>继续未完成的学习。</h1>
      <p>通过手机验证码重置密码。你的学习进度、错题与面试记录都还在。</p>
      <div class="auth-steps" id="forgotAsideSteps">
        <div class="auth-step active" data-step="1">
          <span class="auth-step-dot">1</span>
          <div><b>验证手机</b><span>确认账号归属</span></div>
        </div>
        <div class="auth-step" data-step="2">
          <span class="auth-step-dot">2</span>
          <div><b>重置密码</b><span>设置新的登录密码</span></div>
        </div>
        <div class="auth-step" data-step="3">
          <span class="auth-step-dot">3</span>
          <div><b>完成</b><span>返回登录继续学习</span></div>
        </div>
      </div>
    </div>
    <div class="auth-quote">遇到问题？可联系平台客服，或使用注册手机号重新验证。</div>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <a class="auth-back" href="login.html"><span data-icon="arrowLeft" data-icon-size="15"></span> 返回登录</a>
      <div class="auth-form-head" style="margin-top:20px">
        <h1>找回密码</h1>
        <p>验证注册手机号后，设置新的登录密码</p>
      </div>

      <div class="forgot-steps" id="forgotSteps">
        <div class="forgot-step active" data-fstep="1"><span class="n">1</span>验证手机</div>
        <span class="forgot-line"></span>
        <div class="forgot-step" data-fstep="2"><span class="n">2</span>重置密码</div>
        <span class="forgot-line"></span>
        <div class="forgot-step" data-fstep="3"><span class="n">3</span>完成</div>
      </div>

      <form class="auth-form" id="forgotStep1">
        <div class="field">
          <label class="field-label" for="forgotPhone">手机号</label>
          <div class="input-wrap">
            <span data-icon="phone" data-icon-size="17"></span>
            <input class="input" id="forgotPhone" type="tel" placeholder="请输入注册手机号" maxlength="11">
          </div>
          <p class="field-error">请输入正确的 11 位手机号</p>
        </div>
        <div class="field">
          <label class="field-label" for="forgotCode">验证码</label>
          <div class="row gap-10">
            <input class="input" id="forgotCode" type="text" placeholder="请输入 6 位验证码" maxlength="6" style="flex:1">
            <button class="btn btn-outline" type="button" id="forgotCodeBtn" style="width:118px">获取验证码</button>
          </div>
          <p class="field-error">请输入 6 位验证码</p>
        </div>
        <button class="btn btn-primary btn-block auth-submit" type="submit">下一步</button>
      </form>

      <form class="auth-form hidden" id="forgotStep2">
        <div class="field">
          <label class="field-label" for="newPassword">新密码</label>
          <div class="input-wrap">
            <span data-icon="lock" data-icon-size="17"></span>
            <input class="input" id="newPassword" type="password" placeholder="至少 6 位" maxlength="20" style="padding-right:44px">
            <button type="button" class="input-action" data-toggle-password="#newPassword" aria-label="显示密码" data-icon="eye" data-icon-size="16" style="padding:4px"></button>
          </div>
          <p class="field-error">新密码至少 6 位</p>
        </div>
        <div class="field">
          <label class="field-label" for="newConfirm">确认新密码</label>
          <div class="input-wrap">
            <span data-icon="lock" data-icon-size="17"></span>
            <input class="input" id="newConfirm" type="password" placeholder="请再次输入新密码" maxlength="20">
          </div>
          <p class="field-error">两次输入的密码不一致</p>
        </div>
        <button class="btn btn-primary btn-block auth-submit" type="submit">重置密码</button>
      </form>

      <div class="forgot-success hidden" id="forgotStep3">
        <div class="success-icon" data-icon="checkCircle" data-icon-size="32"></div>
        <h2 style="font-size:20px">密码重置成功</h2>
        <p class="small muted" style="margin-top:8px">请使用新密码重新登录云枢智学</p>
        <a class="btn btn-primary btn-block auth-submit" href="login.html" style="margin-top:22px">立即登录</a>
      </div>
    </div>
  </main>
</div>

<script src="../js/common.js"></script>
<script src="../js/pages/auth.js"></script>
</body>
</html>
